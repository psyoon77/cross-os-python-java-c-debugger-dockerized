services:
  cs-project-docker:
    build:
      context: .
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    init: true
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - .:/workspace
    depends_on:
      ollama:
        condition: service_healthy
    command: tail -f /dev/null
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  ollama_data: